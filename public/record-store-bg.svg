<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#0a0a0a"/>

  <!-- Shelf lines -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Row 1 album covers (pixelated rectangles) -->
  <g opacity="0.3">
    <rect x="30" y="60" width="120" height="120" rx="2" fill="#1a1510"/>
    <rect x="170" y="50" width="120" height="130" rx="2" fill="#15171a"/>
    <rect x="310" y="65" width="120" height="115" rx="2" fill="#1a1515"/>
    <rect x="450" y="55" width="120" height="125" rx="2" fill="#101a15"/>
    <rect x="590" y="70" width="120" height="110" rx="2" fill="#1a1018"/>
    <rect x="730" y="50" width="120" height="130" rx="2" fill="#151a1a"/>
    <rect x="870" y="60" width="120" height="120" rx="2" fill="#1a1a10"/>
    <rect x="1010" y="55" width="120" height="125" rx="2" fill="#101015"/>
  </g>

  <!-- Row 2 -->
  <g opacity="0.25">
    <rect x="50" y="260" width="120" height="120" rx="2" fill="#151018"/>
    <rect x="190" y="250" width="120" height="130" rx="2" fill="#1a1510"/>
    <rect x="330" y="265" width="120" height="115" rx="2" fill="#15181a"/>
    <rect x="470" y="255" width="120" height="125" rx="2" fill="#181a15"/>
    <rect x="610" y="270" width="120" height="110" rx="2" fill="#1a1015"/>
    <rect x="750" y="250" width="120" height="130" rx="2" fill="#10151a"/>
    <rect x="890" y="260" width="120" height="120" rx="2" fill="#1a1810"/>
    <rect x="1030" y="255" width="120" height="125" rx="2" fill="#151a10"/>
  </g>

  <!-- Row 3 -->
  <g opacity="0.2">
    <rect x="40" y="460" width="120" height="120" rx="2" fill="#1a1015"/>
    <rect x="180" y="450" width="120" height="130" rx="2" fill="#151a18"/>
    <rect x="320" y="465" width="120" height="115" rx="2" fill="#10151a"/>
    <rect x="460" y="455" width="120" height="125" rx="2" fill="#1a1a15"/>
    <rect x="600" y="470" width="120" height="110" rx="2" fill="#15101a"/>
    <rect x="740" y="450" width="120" height="130" rx="2" fill="#1a1510"/>
    <rect x="880" y="460" width="120" height="120" rx="2" fill="#101a18"/>
    <rect x="1020" y="455" width="120" height="125" rx="2" fill="#1a1018"/>
  </g>

  <!-- Small vinyl circles on some albums -->
  <g opacity="0.15">
    <circle cx="90" cy="120" r="25" fill="none" stroke="#333" stroke-width="1"/>
    <circle cx="90" cy="120" r="8" fill="#222"/>
    <circle cx="370" cy="320" r="25" fill="none" stroke="#333" stroke-width="1"/>
    <circle cx="370" cy="320" r="8" fill="#222"/>
    <circle cx="670" cy="130" r="25" fill="none" stroke="#333" stroke-width="1"/>
    <circle cx="670" cy="130" r="8" fill="#222"/>
    <circle cx="530" cy="515" r="25" fill="none" stroke="#333" stroke-width="1"/>
    <circle cx="530" cy="515" r="8" fill="#222"/>
    <circle cx="950" cy="320" r="25" fill="none" stroke="#333" stroke-width="1"/>
    <circle cx="950" cy="320" r="8" fill="#222"/>
  </g>
</svg>
